services:
  neo4j:
    image: neo4j:5.26-community
    container_name: movie-graph-neo4j
    environment:
      NEO4J_AUTH: neo4j/moviegraphdev
    ports:
      - "127.0.0.1:17474:7474"
      - "127.0.0.1:17687:7687"
    volumes:
      - neo4j_data:/data
  backend:
    build: ../backend
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: moviegraphdev
    ports:
      - "127.0.0.1:18083:8000"
    depends_on:
      - neo4j
  frontend:
    build: ../frontend
    ports:
      - "127.0.0.1:18082:80"
    depends_on:
      - backend
volumes:
  neo4j_data:
